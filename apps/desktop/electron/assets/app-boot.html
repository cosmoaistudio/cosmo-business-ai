<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmo Business</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #020617;
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background:
          radial-gradient(ellipse 70% 55% at 50% 42%, rgba(59, 130, 246, 0.16) 0%, transparent 62%),
          #020617;
      }
      p {
        margin: 0;
        font-size: 0.8125rem;
        letter-spacing: 0.06em;
        color: rgba(148, 163, 184, 0.9);
      }
    </style>
  </head>
  <body>
    <p>Preparando o universo...</p>
    <!--
      Sync notify — local file loads in ms. Hidden windows throttle rAF/timers.
      Does not wait for Vite, React, auth, or Supabase.
    -->
    <script>
      (function () {
        try {
          var api = window.cosmoDesktop;
          if (api && typeof api.notifyVisualReady === "function") {
            console.info("[Cosmo Renderer] visual-ready (app-boot)");
            api.notifyVisualReady();
          }
        } catch (_) {}
      })();
    </script>
  </body>
</html>
